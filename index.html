<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="description" content="A bilingual browser mystery played through an old computer."><title>The Attic Computer</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./app.css"></head>
<body><div id="screen">
<header><button id="system-brand" aria-label="关于 EVEN SPORE">EVEN SPORE</button><nav id="system-menus" aria-label="系统菜单"></nav><span id="clock">星期五　23:48</span></header>
<main id="desktop" aria-label="桌面"><div id="desktop-icons" class="icon-grid" aria-label="桌面图标"></div><div id="windows"></div></main>
<footer id="desktop-status" role="status">EVEN SPORE</footer>
<section id="boot" aria-label="启动与登录"><div class="boot-card"><div id="boot-symbol" aria-hidden="true"></div><h1>EVEN SPORE</h1><p id="boot-message">正在启动…</p><form id="login-form" autocomplete="off" hidden><label for="login-id">你的称呼</label><input id="login-id" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-1p-ignore data-lpignore="true" required><p class="small">这是你的阅读记录名称，不会改变电脑原有的资料。无需密码。</p><button id="login-submit">进入桌面</button><p id="login-error" role="status"></p></form><button id="boot-skip" type="button">继续</button></div></section>
</div><script src="./app.js"></script></body></html>
